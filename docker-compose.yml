services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    ports:
      - "127.0.0.1:${KSM_DEMO_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092,EXTERNAL://localhost:${KSM_DEMO_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="root" password="local-demo" user_root="local-demo" user_manager="local-demo" user_app="local-demo";'
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="root" password="local-demo" user_root="local-demo" user_manager="local-demo" user_app="local-demo";'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:root;User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes:
      - ./example:/demo:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /demo/demo-root.properties >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
  init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./example:/demo:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-acls.sh --bootstrap-server kafka:9092 --command-config /demo/demo-root.properties --add --allow-principal User:manager --operation Alter --operation Describe --cluster
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /demo/demo-root.properties --create --if-not-exists --topic orders --partitions 1 --replication-factor 1
  ksm:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      KSM_READONLY: "false"
      KSM_REFRESH_FREQUENCY_MS: 1000
      ADMIN_CLIENT_BOOTSTRAP_SERVERS: kafka:9092
      ADMIN_CLIENT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      ADMIN_CLIENT_SASL_MECHANISM: PLAIN
      ADMIN_CLIENT_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="manager" password="local-demo";'
      SOURCE_CLASS: io.conduktor.ksm.source.FileSourceAcl
      SOURCE_FILE_FILENAME: /example/demo-acls.csv
    volumes:
      - ./example:/example:ro
